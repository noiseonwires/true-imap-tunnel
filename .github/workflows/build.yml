name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Optional build version override, for example 0.4.0'
        required: false
        type: string

env:
  GO_VERSION: '1.26'

jobs:
  go-test:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: Run unit tests
        run: go test -count=1 -timeout 300s ./...

  build-go:
    name: Go ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: go-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            ext: ''
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            ext: ''
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: '.exe'
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            ext: ''
          - goos: android
            goarch: arm64
            suffix: android-arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Resolve build version
        env:
          BUILD_VERSION_OVERRIDE: ${{ github.event.inputs.build_version }}
        run: |
          set -euo pipefail
          version="$BUILD_VERSION_OVERRIDE"
          if [ -z "$version" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="dev-${GITHUB_SHA::7}"
            fi
          fi
          if [[ "$version" =~ [[:space:]] ]]; then
            echo "Build version must not contain whitespace: $version" >&2
            exit 1
          fi
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "Build version: $version"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          DATE="$(date +%Y%m%d-%H%M%S)"
          HASH="$(git rev-parse --short HEAD)"
          go build -trimpath -ldflags="-s -w -X main.buildVersion=$BUILD_VERSION -X main.buildDate=$DATE -X main.buildHash=$HASH" \
            -o dist/true-imap-tunnel-${{ matrix.suffix }}${{ matrix.ext }} \
            ./cmd/true-imap-tunnel
      - name: Install 7-Zip
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
      - name: Package
        run: |
          set -euo pipefail

          package="true-imap-tunnel-${{ matrix.suffix }}"
          binary="dist/${package}${{ matrix.ext }}"

          if [ "${{ matrix.goos }}" = "linux" ] || [ "${{ matrix.goos }}" = "darwin" ]; then
            mkdir -p "package/${package}"
            cp "$binary" "package/${package}/true-imap-tunnel${{ matrix.ext }}"
            cp README.md LICENSE config.example.yaml "package/${package}/"
            cp -R docs "package/${package}/docs"
            tar -cf - -C package "$package" | gzip -9 > "dist/${package}.tar.gz"
            rm "$binary"
          elif [ "${{ matrix.goos }}" = "windows" ]; then
            mkdir -p "package/${package}"
            cp "$binary" "package/${package}/true-imap-tunnel${{ matrix.ext }}"
            cp README.md LICENSE config.example.yaml "package/${package}/"
            cp -R docs "package/${package}/docs"
            (cd package && 7z a -t7z -mx=9 -m0=LZMA2 -mmt=on "../dist/${package}.7z" "$package")
            rm "$binary"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  build-android-plugin:
    name: Shadowsocks Android plugin
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - name: Resolve build version
        env:
          BUILD_VERSION_OVERRIDE: ${{ github.event.inputs.build_version }}
        run: |
          set -euo pipefail
          version="$BUILD_VERSION_OVERRIDE"
          if [ -z "$version" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="dev-${GITHUB_SHA::7}"
            fi
          fi
          if [[ "$version" =~ [[:space:]] ]]; then
            echo "Build version must not contain whitespace: $version" >&2
            exit 1
          fi
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "Build version: $version"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable APK
        working-directory: android-plugin
        run: gradle :app:assembleDebug -PbuildVersion="$BUILD_VERSION"
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android-plugin/app/build/outputs/apk/debug/app-debug.apk dist/TITS-shadowsocks-plugin-android-debug.apk
      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk="dist/TITS-shadowsocks-plugin-android-debug.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          if ! "$apksigner" verify "$apk" > /tmp/apksigner.log 2>&1; then
            cat /tmp/apksigner.log
            exit 1
          fi
          echo "APK signature verified: $apk"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowsocks-android-plugin-debug
          path: dist/TITS-shadowsocks-plugin-android-debug.apk
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-go, build-android-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'true-imap-tunnel-*' -o -name '*.apk' \) -exec cp -v {} release/ \;
          ls -la release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
